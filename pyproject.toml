[project]
name = "ai-resume-analyzer"
version = "0.1.0"
description = "LangGraph-powered resume analyzer backend and testing UI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "langgraph>=0.1.0",
  "openai>=1.30.0",
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.9",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "pdfplumber>=0.11.0",
  "PyPDF2>=3.0.1",
  "python-docx>=1.1.0",
  "streamlit>=1.35.0",
  "requests>=2.32.0",
  "tenacity>=8.2.3"
]

[tool.uv]
# Using uv for dependency management


